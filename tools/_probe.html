<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PROBE</title>
<style>
  html,body{margin:0;background:#000;font:12px/1.5 ui-monospace,Consolas,monospace;color:#7dff9b}
  #f{width:390px;height:844px;border:0;display:block;background:#000}
  #info{position:fixed;left:400px;top:8px;width:380px;white-space:pre-wrap}
</style>
</head><body>
<iframe id="f" src="../index.html"></iframe>
<div id="info">booting…</div>
<script>
const q = new URLSearchParams(location.search);
const act = q.get('act') || 'none';
const f = document.getElementById('f');
const info = document.getElementById('info');

function overflowReport(d, vw) {
  const out = [];
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width > 0 && (r.right > vw + 0.5 || r.left < -0.5)) {
      const cls = (typeof el.className === 'string' ? el.className : '').split(' ').filter(Boolean).slice(0, 2).join('.');
      out.push(el.tagName.toLowerCase() + (cls ? '.' + cls : '') + ' [' + Math.round(r.left) + '→' + Math.round(r.right) + ' w' + Math.round(r.width) + ']');
    }
  });
  return out;
}

f.addEventListener('load', () => setTimeout(() => {
  const d = f.contentDocument, w = f.contentWindow;
  try {
    if (q.get('anim') === '0') {
      const st = d.createElement('style');
      st.textContent = '*{animation:none!important;transition:none!important}';
      d.head.appendChild(st);
    }
    if (act === 'reset') { w.localStorage.clear(); w.location.reload(); return; }
    if (act === 'done' || act === 'focus') {
      const b = d.querySelector('#obDone');
      if (b) b.click();
    }
    if (act === 'focus') {
      setTimeout(() => {
        const t = d.querySelector('.tab[data-v="focus"]');
        if (t) t.click();
      }, 400);
    }
    const tab = q.get('tab');
    if (tab) {
      setTimeout(() => {
        const t = d.querySelector('.tab[data-v="' + tab + '"]');
        if (t) t.click();
      }, 300);
    }
    const act2 = q.get('do');
    if (act2) {
      setTimeout(() => {
        const el = d.querySelector(act2);
        if (el) el.click();
      }, 600);
    }
  } catch (e) {
    info.textContent = 'act ERR ' + e.message;
  }
  setTimeout(() => {
    const vw = w.innerWidth;
    const rows = overflowReport(d, vw);
    const st = w.__dbg ? w.__dbg() : '';
    info.textContent =
      'act=' + act +
      '\niframe vw=' + vw + ' scrollW=' + d.documentElement.scrollWidth +
      '\noverflow=' + rows.length + (rows.length ? '\n  ' + rows.slice(0, 10).join('\n  ') : '') +
      (st ? '\n' + st : '') +
      '\nview: ' + ([...d.querySelectorAll('.view')].find(v => v.offsetParent !== null) || {}).id;
  }, 1400);
}, 700));
</script>
</body></html>
